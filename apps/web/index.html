<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>MacStats</title>
    <meta name="description" content="Free, open-source system monitor for macOS. CPU, memory, disk, network, temperature and the top processes, right in the menu bar." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="theme-color" content="#141619" />

    <!-- Link previews (iMessage, WhatsApp, Slack, X, LinkedIn…). Crawlers need absolute URLs,
         so set VITE_SITE_URL in .env to the deployed origin. The image comes from og/og-image.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MacStats" />
    <meta property="og:title" content="MacStats — your Mac’s vitals, one glance away" />
    <meta property="og:description" content="Free, open-source system monitor for the macOS menu bar. CPU, memory, disk, network, temperature and the top processes." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The MacStats dropdown open under the macOS menu bar, next to the headline “Your Mac’s vitals, one glance away.”" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
