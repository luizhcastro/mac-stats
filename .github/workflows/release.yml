name: Release MacStats

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, Sign, Notarize, Release
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "VERSION=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build app bundle
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./Scripts/bundle.sh release

      - name: Resolve app path
        run: |
          APP_PATH="$(swift build -c release --show-bin-path)/MacStats.app"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Codesign app
        run: |
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application" \
            "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +e
          ditto -c -k --keepParent "$APP_PATH" MacStats-notarize.zip
          xcrun notarytool submit MacStats-notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1 | tee notarize-output.log
          SUBMIT_EXIT=${PIPESTATUS[0]}
          SUBMISSION_ID=$(grep "id:" notarize-output.log | head -1 | awk '{print $2}')
          echo "Submission ID: $SUBMISSION_ID"
          echo "Submit exit code: $SUBMIT_EXIT"
          if [ -n "$SUBMISSION_ID" ]; then
            echo "Fetching notary log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
          fi
          if grep -q "status: Accepted" notarize-output.log; then
            echo "Notarization successful!"
          else
            echo "Notarization failed."
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          create-dmg \
            --volname "MacStats" \
            --window-pos 200 120 \
            --window-size 660 420 \
            --icon-size 100 \
            --icon "MacStats.app" 170 200 \
            --hide-extension "MacStats.app" \
            --app-drop-link 490 200 \
            "MacStats-${VERSION}.dmg" \
            "$APP_PATH"

      - name: Sign and notarize DMG
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="MacStats-${VERSION}.dmg"
          codesign --force --sign "Developer ID Application" --timestamp "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MacStats ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: MacStats-*.dmg
          draft: false
          prerelease: false
          make_latest: true
