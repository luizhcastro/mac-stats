name: Release MacStats

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, Sign, Notarize, Release
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "VERSION=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build app bundle
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          UMAMI_HOST: ${{ vars.UMAMI_HOST }}
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
        run: ./Scripts/bundle.sh release

      - name: Resolve app path
        run: |
          APP_PATH="$(swift build -c release --show-bin-path)/MacStats.app"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Codesign app
        run: |
          # Nested Sparkle code must be signed inside-out before the app itself.
          SIGN=(codesign --force --options runtime --timestamp --sign "Developer ID Application")
          FW="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          "${SIGN[@]}" "$FW/Versions/B/XPCServices/Installer.xpc"
          "${SIGN[@]}" --preserve-metadata=entitlements "$FW/Versions/B/XPCServices/Downloader.xpc"
          "${SIGN[@]}" "$FW/Versions/B/Autoupdate"
          "${SIGN[@]}" "$FW/Versions/B/Updater.app"
          "${SIGN[@]}" "$FW"
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application" \
            "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +e
          ditto -c -k --keepParent "$APP_PATH" MacStats-notarize.zip
          xcrun notarytool submit MacStats-notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1 | tee notarize-output.log
          SUBMIT_EXIT=${PIPESTATUS[0]}
          SUBMISSION_ID=$(grep "id:" notarize-output.log | head -1 | awk '{print $2}')
          echo "Submission ID: $SUBMISSION_ID"
          echo "Submit exit code: $SUBMIT_EXIT"
          if [ -n "$SUBMISSION_ID" ]; then
            echo "Fetching notary log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
          fi
          if grep -q "status: Accepted" notarize-output.log; then
            echo "Notarization successful!"
          else
            echo "Notarization failed."
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          create-dmg \
            --volname "MacStats" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --background "Resources/dmg-background.tiff" \
            --icon-size 100 \
            --icon "MacStats.app" 170 200 \
            --hide-extension "MacStats.app" \
            --app-drop-link 490 200 \
            "MacStats-${VERSION}.dmg" \
            "$APP_PATH"

      - name: Sign and notarize DMG
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="MacStats-${VERSION}.dmg"
          codesign --force --sign "Developer ID Application" --timestamp "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Generate Sparkle appcast
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Must run after stapling: the EdDSA signature covers the final DMG bytes.
          SPARKLE_VERSION=$(sed -n 's/.*Sparkle", exact: "\(.*\)").*/\1/p' Package.swift)
          curl -sSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" | tar xJ -C "$RUNNER_TEMP" bin/sign_update
          DMG="MacStats-${VERSION}.dmg"
          SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/bin/sign_update" --ed-key-file - "$DMG")
          cat > appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>MacStats</title>
              <item>
                <title>MacStats ${VERSION}</title>
                <pubDate>$(date -R)</pubDate>
                <link>https://github.com/${{ github.repository }}/releases/tag/v${VERSION}</link>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <enclosure url="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${DMG}" ${SIGNATURE} type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          XML
          cat appcast.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MacStats ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            apps/macos/MacStats-*.dmg
            apps/macos/appcast.xml
          draft: false
          prerelease: false
          make_latest: true
